[workspace]
resolver = "2"
members = ["crates/gire-domain", "crates/gire-evidence", "crates/gire-topology", "crates/gire-equipment", "crates/gire-electrical", "crates/gire-operating-point"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/KigHeart/GIRE"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.16", features = ["serde", "v4"] }
