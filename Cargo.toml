[workspace]
resolver = "2"
members = ["crates/gire-domain"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/KigHeart/GIRE"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
